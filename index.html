<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title></title>
  <style>
    *{
      justify-items: center;
      font-family: 'DM Sans',sans-serif;
    }
    body {
      background: #060F1A;
    }
    .mobile {
      width: 300px;
      height: 550px;
      background: #060F1A;
      border: 3px solid #42445A;
      border-radius: 38px;
      margin: 50px 0 0 0;
    }
    .top {
      width: 40%;
      height: 26px;
      background: #42445A;
      border-radius: 0 0 20px 20px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .notch {
      width: 5px;
      height: 5px;
      background: #0B1C2D;
      border: 2px solid #555EBD;
      border-radius: 50px;
    }
    .speaker {
      width: 50%;
      height: 5px;
      background: #0B1C2D;
      border-radius: 10px;
    }
    .main {
      width: 100%;
      height: 95%;
      border-radius: 38px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .shadow {
      width: 150px;
      height: 150px;
      border: 2px solid rgba(0, 146, 250, 0.1);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 0 10px 0;
    }
    .shadow2 {
      width: 125px;
      height: 125px;
      border: 2px solid rgba(0, 146, 250, 0.2);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .voice {
      width: 100px;
      height: 100px;
      background: radial-gradient(circle,rgba(0, 116, 250, 0.8), transparent 80%);
      border: 2px solid rgba(0, 146, 250, 1.0);
      border-radius: 50%;
      box-shadow: 0 0 40px  rgba(0, 146, 250, 0.71);
      align-items: center;
      justify-content: center;
      display: flex;
    }
    .text {
      font-size: 30px;
      font-weight: 600;
      color: #FFFFFF;
      margin: 0 0 10px 0; 
    }
    .text2 {
      font-size: 15px;
      font-weight: 300;
      color: #50515F;
      font-family: 'DM Sans',sans-serif;
      letter-spacing: 4px;
      margin: 0 0 20px 0;
    }
    .loader {
      width: 60%;
      height: 5px;
      background: rgba(0, 146, 250, 0.2);
      border-radius: 50px;
      justify-items: start;
      margin: 0 0 10px 0;
    }
    .load {
      width: 50%;
      height: 5px;
      background: rgba(0, 146, 250, 1.0);
      border-radius: 50px;
    }
    .bottom {
      color: #50515F;
      font-size: 15px;
      font-weight: 300px;
      letter-spacing: 1px;
    }
  </style>
</head>

<body>
  <div class="mobile">
    <div class="top">
      <div class="notch"></div>
      <div class="speaker"></div>
    </div>
    <div class="main">
      <div class="shadow">
        <div class="shadow2">
          <div class="voice">
            <span style="font-size: 40px;">🎙</span>
          </div>
        </div>
      </div>
      <div class="text">
        VoiceGuard
      </div>
      <div class="text2">
        VOICE ASSISTANT 
      </div>
      <div class="loader">
        <div class="load"></div>
      </div>
      <div class="bottom">
        v1.0.0 · Offline · Secure
      </div>
      
    </div>
    
  </div>
</body>

</html>
